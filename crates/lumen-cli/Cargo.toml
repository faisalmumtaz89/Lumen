[package]
name = "lumen-cli"
description = "CLI for Lumen LLM inference engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "lumen"
path = "src/main.rs"

[features]
default = ["download"]
download = ["ureq", "url", "percent-encoding", "indicatif", "dirs", "sha2", "dep:lumen-image"]
cuda = ["lumen-runtime/cuda", "lumen-image?/cuda"]

[dependencies]
libc = "0.2"
lumen-format.workspace = true
lumen-runtime.workspace = true
lumen-convert.workspace = true
lumen-bench.workspace = true
# The image checkpoint converter `lumen pull` runs; with `cuda`, it also
# checks a conversion as the CUDA server does at start-up.
lumen-image = { workspace = true, optional = true }
regex = "1"
fancy-regex = "0.14"
unicode-normalization = "0.1"
toml = "1.1"
ureq = { version = "2", default-features = false, features = ["tls", "socks-proxy"], optional = true }
url = { version = "2", optional = true }
percent-encoding = { version = "2", optional = true }
indicatif = { version = "0.18", optional = true }
dirs = { version = "6", optional = true }
sha2 = { version = "0.11", optional = true }
# global allocator (declared in src/main.rs). Targets macOS
# libmalloc fragmentation that surfaced under sustained server-style
# load. Compatible with all other crate deps.
mimalloc = { workspace = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
