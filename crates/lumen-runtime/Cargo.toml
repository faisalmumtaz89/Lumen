[package]
name = "lumen-runtime"
description = "Core inference engine with Metal GPU, SIMD, and scalar compute backends"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
cuda = ["dep:cudarc"]
# Test-only feature: enables a one-shot fault-injection hook that forces
# `launch_hgemv_bf16` / `_residual` to return `Bf16LaunchOutcome::CublasFailure`
# without actually calling cuBLAS. Used by the
# `cuda_bf16_gemmex_fault_injection_test` integration suite to drive the
# wrapper's per-call CUBLAS-failure -> legacy-kernel fall-through arm.
# The hook is `#[cfg(any(test, feature = "test-fault-injection"))]` so it is
# also reachable from in-tree `#[test]` functions without the feature
# being enabled at the workspace level; production builds without the
# feature have zero overhead from the inject path.
test-fault-injection = []

# Quality-oracle build: forces EVERY Q4 projection family onto F32 activations,
# overriding the topology-derived plan. This is the reference arm the shipped
# activation policy is measured against — a paired quality comparison needs an
# exact-path control built from the SAME source revision, so that any
# difference is attributable to activation precision and nothing else.
#
# Compile-time only, and deliberately so: there is no runtime switch for it,
# it is never enabled in a release build, and it cannot be reached by setting
# an environment variable on a shipped binary.
quality-oracle = []

# Diagnostic build for locating WHICH projection families tolerate int8
# activations. Reads `LUMEN_Q4_ACT_PROBE` (comma-separated family names) and
# puts exactly those on Q8_1 with every other family on F32, ignoring the
# shipped policy. Compile-time gated for the same reason as `quality-oracle`:
# a shipped binary must have no way to reach it.
activation-probe = []

[dependencies]
lumen-format.workspace = true
thiserror.workspace = true
libc = "0.2"
# CUDA API surface is pinned EXPLICITLY to 12020, not detected from the build
# system. The shippable binary builds with NO CUDA toolkit (kernels JIT at
# runtime via NVRTC), so `cuda-version-from-build-system` finds nothing and
# `fallback-latest` would select the newest surface (cuda-13010) — which eagerly
# dlsyms symbols like `cuDevSmResourceSplit` that no shipping driver exports (they
# have `cuDevSmResourceSplitByCount`), aborting the server on startup. 12020
# matches the CUDA 12.2 runtime (libnvrtc/libcublas) we ship/validate against and
# is forward-compatible with newer drivers. Bump deliberately if a newer API is
# ever needed — never go back to build-system detection + fallback-latest.
#
# Version is pinned EXACT (=0.19.3, not caret "0.19") because the feature surface
# is load-bearing: a future 0.19.x could rename/regate symbols and silently
# reintroduce the startup crash. CI builds with `cargo build --locked`. Dependabot
# tracks this so a bump is a reviewed PR (and re-validated on the Modal matrix).
cudarc = { version = "=0.19.3", default-features = false, features = ["std", "driver", "nvrtc", "cublas", "f16", "fallback-dynamic-loading", "cuda-12020"], optional = true }

# Chat-template rendering. The model's chat_template is embedded in the LBC
# (Qwen3.5 ships the NATIVE `<function=..><parameter=..>` tool-calling protocol
# in Jinja2). Rendering it through a real Jinja engine here — instead of the
# old hard-coded ChatML string — is the SINGLE source of truth the CLI and the
# server both call, so their rendered prompts cannot drift from the pinned
# template. `adjacent_loop_items` enables `loop.previtem`/`loop.nextitem` (the
# template groups consecutive tool-result turns into one user turn with them).
# `minijinja-contrib`'s pycompat callback supplies the Python str methods
# (`.split`/`.startswith`/`.endswith`/`.rstrip`/`.lstrip`) the HF-authored
# template uses, so minijinja reproduces the reference jinja2 byte-for-byte.
# `preserve_order`: minijinja's own maps default to BTreeMap (sorted keys); this
# makes them insertion-ordered so `tool | tojson` matches the reference jinja2.
minijinja = { version = "2", features = ["adjacent_loop_items", "loop_controls", "preserve_order"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
# JSON is intrinsic to tool calling: building the message/tool render context,
# schema-aware argument reconstruction, and coercing `<parameter>` values by the
# tool schema. (Runtime avoided serde historically; tool calling requires it.)
# `preserve_order` keeps object keys in INSERTION order so `tool | tojson` in the
# chat template serializes keys in the order the client sent them — byte-matching
# the reference jinja2 (`json.dumps(sort_keys=False)`), not BTreeMap-sorted.
serde_json = { version = "1", features = ["preserve_order"] }
serde = "1"

[lints]
workspace = true
