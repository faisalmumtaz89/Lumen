# Lumen CI — build + CPU tests + lint on every push/PR.
# Runs entirely on GitHub-hosted runners (free): no GPU and no CUDA/Metal SDK are
# needed to BUILD, because all GPU kernel compilation is deferred to runtime
# (NVRTC for CUDA, MSL for Metal). GPU correctness/quality is validated separately
# by validate-cuda-modal.yml (Modal) and validate-metal.yml (self-hosted Mac).
#
# Activated by moving into .github/workflows/ (this PR). Actions are SHA-pinned
# (Dependabot-tracked) and builds use --locked so the committed Cargo.lock — which
# pins the load-bearing cudarc surface — is enforced.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per ref; new pushes cancel the old to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test-cpu:
    # The CPU reference suite (lumen-format, lumen-convert, lumen-cli) runs without
    # a GPU — see README "Requirements". The lumen-runtime GPU paths are validated
    # in the dedicated GPU workflows, not here.
    name: cpu tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: install pinned toolchain (rust-toolchain.toml -> 1.93.1 + rustfmt/clippy)
        run: rustup show
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # HARD gates. The repo is fmt-clean and clippy-clean under the pinned toolchain
      # (rust-toolchain.toml 1.93.1). clippy uses the deliberate [workspace.lints]
      # policy (deny clippy::all + a curated allow-list) — no `-D warnings` needed
      # (and it must NOT be used: it would override the manifest's allow list).
      # This ubuntu run covers the cross-platform + server code; the metal-only path
      # (cfg(macos)) is clippy-checked in the build-macos-metal job below.
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy (workspace)
        run: cargo clippy --locked --workspace --release
      - name: cpu test suite
        run: cargo test --locked -p lumen-format -p lumen-convert -p lumen-cli --release
      - name: detector self-test
        run: python3 quality/detectors.py --selftest

  build-linux-cuda:
    # Compile-check the CUDA build. cudarc uses fallback-dynamic-loading, so this
    # links against NOTHING at build time (libcuda/libnvrtc/libcublas are dlopen'd
    # at runtime) — a GitHub-hosted runner with no CUDA SDK builds it fine.
    name: build linux/cuda (sm_80 target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: install pinned toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: build server (cuda)
        run: cargo build --release --locked -p lumen-server -p lumen-cli --features bin,cuda
      - name: compile cuda unit tests (no GPU run)
        run: cargo test --locked -p lumen-runtime --features cuda --release --no-run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lumen-linux-x86_64-cuda
          path: |
            target/release/lumen-server
            target/release/lumen
          if-no-files-found: error
          retention-days: 7

  build-macos-metal:
    # Build-smoke for Apple Silicon on a hosted runner: confirms it compiles + links
    # only system frameworks. The hosted macOS runner is virtualized with no reliable
    # Metal GPU, so functional Metal validation happens on the self-hosted Mac
    # (validate-metal.yml), not here.
    name: build macos/metal (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: install pinned toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # clippy the metal-only path here (cfg(macos) code is excluded on the ubuntu
      # run). Same [workspace.lints] policy.
      - name: clippy (workspace, metal path)
        run: cargo clippy --locked --workspace --release
      - name: build server + cli (metal default)
        run: cargo build --release --locked -p lumen-server -p lumen-cli --features bin
      - name: link audit (system frameworks only)
        run: |
          otool -L target/release/lumen-server
          # Fail if anything outside system framework / dyld paths is linked.
          if otool -L target/release/lumen-server | tail -n +2 \
             | grep -vE '/usr/lib/|/System/Library/'; then
            echo "::error::non-system dynamic dependency found in lumen-server"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lumen-macos-arm64-metal
          path: |
            target/release/lumen-server
            target/release/lumen
          if-no-files-found: error
          retention-days: 7
