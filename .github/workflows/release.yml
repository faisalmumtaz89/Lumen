# Release: on a SemVer `v<X.Y.Z>` tag (or a `v<X.Y.Z>-rc.N` pre-release), build the shippable binaries ONCE, then
# validate those EXACT bytes on real hardware, then publish ONLY if validation is
# green. Artifacts are promoted (downloaded + reused), never independently rebuilt —
# so "what ships" is provably "what was validated".
#
#   build-linux ─┐                          ┌─ publish-docker  (ghcr.io)
#                ├─ validate-cuda (Modal) ───┤
#                │                          └─ publish-release ─┐ (GitHub Release:
#   build-macos ─┴─ validate-macos (Mac) ───────────────────────┘  tarballs + brew)
#
# Channels: macOS arm64 tarball + Homebrew formula; Linux/CUDA tarball + Docker
# image (ghcr.io). All built on hosted runners (no GPU/SDK needed to build); GPUs
# only validate.
#
# To activate: see packaging/ci/SETUP.md, then `git mv` this file to .github/workflows/.
name: release

on:
  push:
    tags: ['v*']   # SemVer only: v<X.Y.Z> ships; v<X.Y.Z>-rc.N is a pre-release dry-run (see RELEASING.md)

# Least-privilege at the top; only the publish jobs widen their own scope.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. Build the shippable binaries ONCE, upload as workflow artifacts ────────
  build-linux:
    name: build linux/cuda binaries
    # Ubuntu 22.04, the base of the published image (packaging/modal/Dockerfile).
    # A binary linked against a newer glibc can require it, so this label sets the
    # oldest glibc the Linux binaries start on; packaging/ci/glibc_floor.sh checks it.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install pinned toolchain (rust-toolchain.toml)
        run: rustup show
      # Its key carries no Ubuntu version: a cache from a newer one holds build
      # scripts that need that one's glibc.
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          key: ubuntu-22.04
      - name: build
        run: |
          cargo build --release --locked -p lumen-server -p lumen-cli --features bin,cuda,image
          cargo build --release --locked -p lumen-image --bin lbi-convert
      - name: glibc the binaries need
        run: packaging/ci/glibc_floor.sh target/release/lumen target/release/lumen-server target/release/lbi-convert
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-cuda-bins
          path: |
            target/release/lumen
            target/release/lumen-server
            target/release/lbi-convert
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: build macOS arm64 tarball
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install pinned toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      # LUMEN_TAG = the actual git tag, so the asset name matches the Release tag
      # (was defaulting to b<rev-count>, which 404'd the installer).
      - name: build tarball
        env:
          LUMEN_TAG: ${{ github.ref_name }}
        run: bash packaging/macos/build-tarball.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-tarball
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # ── 2. Validate the EXACT artifacts before anything is published ──────────────
  validate-cuda:
    name: validate linux/cuda binary (Modal, full matrix)
    needs: build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: guard — secrets present
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::MODAL_TOKEN_ID / MODAL_TOKEN_SECRET not set — cannot validate a release"; exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: install modal
        run: pip install 'modal~=1.4'
      # Promote: stage the SAME binary that will ship into the Modal image.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-cuda-bins
          path: packaging/modal/bin
      - name: run modal validation (full arch matrix)
        run: |
          set -o pipefail
          chmod +x packaging/modal/bin/* || true
          modal run packaging/modal/validate_arches.py --arches "T4,A10G,L4,A100,H100" | tee modal-validation.log
      - name: stop lingering modal containers
        if: always()
        run: modal app stop lumen-phase1-arch-validation 2>/dev/null || true
      - name: gate
        run: grep -q "VALIDATION PASSED" modal-validation.log || { echo "::error::release CUDA validation FAILED — not publishing"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: release-cuda-validation, path: modal-validation.log, if-no-files-found: warn }

  validate-macos:
    name: validate macOS tarball (self-hosted Metal)
    needs: build-macos
    runs-on: [self-hosted, macos, arm64, metal]
    # Share the single-Mac serialization lock with validate-metal.yml.
    concurrency:
      group: metal-selfhosted
      cancel-in-progress: false
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-tarball
          path: dist
      # Validate the EXACT binary inside the tarball that will ship (DET-001 +
      # coherence on the real Metal GPU), not a fresh rebuild.
      - name: extract + metal validate the shipped binary
        env:
          LUMEN_CACHE_DIR: ${{ runner.temp }}/lumen-cache
        run: |
          set -euo pipefail
          tb="$(ls dist/lumen-*-macos-arm64-metal.tar.gz | head -1)"
          mkdir -p "${RUNNER_TEMP}/unpack" && tar -C "${RUNNER_TEMP}/unpack" -xzf "$tb"
          export LUMEN_SERVER_BIN="$(find "${RUNNER_TEMP}/unpack" -name lumen-server | head -1)"
          export LUMEN_BIN="$(find "${RUNNER_TEMP}/unpack" -name lumen | head -1)"
          xattr -dr com.apple.quarantine "$LUMEN_SERVER_BIN" "$LUMEN_BIN" 2>/dev/null || true
          bash packaging/ci/metal_validate.sh

  # ── 3. Publish — ONLY after build + both validations are green ────────────────
  publish-release:
    name: publish GitHub Release (tarballs + homebrew)
    needs: [build-linux, build-macos, validate-cuda, validate-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the Release + upload assets (scoped to this job)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: macos-tarball, path: dist }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: linux-cuda-bins, path: linux-bins }
      - name: package linux tarball + checksums + homebrew formula
        env:
          TAG: ${{ github.ref_name }}
        run: bash packaging/macos/finalize-release.sh
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # A tag with a hyphen (v0.1.0-rc.1) is a SemVer pre-release: mark it as a
          # GitHub prerelease so it does NOT become "Latest release" — which keeps the
          # install.sh / Homebrew `latest` channel pinned to the last final release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/lumen.rb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-docker:
    name: publish Linux/CUDA image -> ghcr.io
    needs: [build-linux, validate-cuda]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # ghcr push (scoped to this job)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Promote: bake the SAME validated binary into the image (Dockerfile COPYs
      # bin/ from its build context = packaging/modal).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: linux-cuda-bins, path: packaging/modal/bin }
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build + push
        run: |
          set -euo pipefail
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"  # ghcr requires lowercase
          img="ghcr.io/${repo}"
          chmod +x packaging/modal/bin/* || true
          # Context = packaging/modal so the Dockerfile's `COPY bin/...` resolves;
          # the license/notice files must be staged into it for the same reason.
          cp LICENSE-APACHE LICENSE-MIT THIRD_PARTY_NOTICES.md packaging/modal/
          docker build -t "${img}:${GITHUB_REF_NAME}" packaging/modal
          docker push "${img}:${GITHUB_REF_NAME}"
          # Move :latest only on a FINAL release — a pre-release tag (v0.1.0-rc.1,
          # contains a hyphen) publishes its versioned image but must not steal :latest.
          if [[ "${GITHUB_REF_NAME}" != *-* ]]; then
            docker tag "${img}:${GITHUB_REF_NAME}" "${img}:latest"
            docker push "${img}:latest"
          fi
