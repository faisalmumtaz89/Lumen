# CUDA cross-arch validation via Modal (no self-hosted GPU runner needed).
#
# A free GitHub-hosted runner holds the Modal token and drives Modal, which spins
# the real GPUs on demand and runs the validation there (packaging/modal/
# validate_arches.py). This validates the shippable Linux/CUDA binary on real
# NVIDIA silicon — run + byte-determinism (DET-001) + coherence + PTX-cache —
# across compute capabilities, without an always-on exposed GPU box.
#
# Cost control: PRs, push-to-main, and manual runs validate ONE arch (A100). A
# change-detection job skips Modal entirely for docs-/tooling-only PRs. The full
# sm_75..sm_90 matrix runs (a) on demand via workflow_dispatch (arches=...), and
# (b) at release time in release.yml — which validates the EXACT promoted artifact,
# so tags are intentionally NOT a trigger here (no duplicate / validated!=shipped).
#
# PR gating: runs on pull_request, but the modal job runs ONLY for same-repo
# branches (the `if` skips fork PRs — head repo != this repo — and GitHub withholds
# secrets from forks anyway, so a fork PR can never spend Modal or see the token).
#
# Required check: mark the `cuda-gate` job (NOT `modal-validate`) as the required
# status check in branch protection — it always runs and reports, so a docs-only
# PR (modal skipped) does not deadlock on a check that never ran.
#
# Secrets required (repo Settings -> Secrets -> Actions): MODAL_TOKEN_ID, MODAL_TOKEN_SECRET.
# To activate: see packaging/ci/SETUP.md, then `git mv` this file to .github/workflows/.
name: validate-cuda-modal

on:
  push:
    branches: [main]   # tags are validated by release.yml (the promoted artifact)
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'   # weekly Mon 07:00 UTC — catch Modal-driver / toolchain drift between commits
  workflow_dispatch:
    inputs:
      arches:
        description: 'Comma-separated Modal GPUs. Empty = A100 smoke (full matrix on a tag). e.g. "T4,A10G,L4,A100,H100"'
        required: false
        default: ''

concurrency:
  group: cuda-modal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decide whether the engine / deps / harness / binary-embedded assets actually
  # changed. Replaces a trigger-level `paths:` filter — which, when it skips a
  # workflow, never reports a status and so DEADLOCKS a required check on a
  # docs-only PR. Non-PR events (push/tag/schedule/dispatch) are always relevant.
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"; echo "non-PR event -> validate"; exit 0
          fi
          # Engine, workspace deps, the Modal harness, AND assets compiled into the
          # binary via include_str! (model_registry.toml, tokenizer fixtures).
          if git diff --name-only "$BASE" "$HEAD" \
             | grep -qE '^(crates/|Cargo\.(toml|lock)$|model_registry\.toml$|tests/fixtures/|packaging/modal/|\.github/workflows/validate-cuda-modal\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"; echo "engine/deps/assets changed -> validate"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"; echo "docs/tooling-only -> skip GPU validation"
          fi

  modal-validate:
    needs: changes
    # Run only when relevant AND same-repo AND not a Dependabot PR. Fork PRs (head
    # repo != this repo) are skipped so the Modal token is never exposed. Dependabot
    # PRs are also skipped: GitHub withholds repo secrets from them, so this job
    # would otherwise fail the secret-guard on every dep bump. cuda-gate treats a
    # skipped modal-validate as a pass — dep PRs are still build+CPU-tested by ci.yml,
    # and dependency bumps that affect the GPU runtime get re-validated on push-to-main
    # (or a manual workflow_dispatch) before/after merge.
    if: >-
      needs.changes.outputs.relevant == 'true' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: guard — secrets present
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::MODAL_TOKEN_ID / MODAL_TOKEN_SECRET secrets not set — see packaging/ci/SETUP.md"
            exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: install modal
        run: pip install 'modal~=1.4'   # pinned minor; bump deliberately (Dependabot-tracked)

      - name: install pinned toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2

      # --locked: the committed Cargo.lock is load-bearing (it pins cudarc 0.19.3,
      # whose feature surface is THE fix for the no-SDK startup crash). Enforce it.
      - name: build linux/cuda binary
        run: cargo build --release --locked -p lumen-server -p lumen-cli --features bin,cuda

      - name: stage binaries for the modal image
        run: |
          mkdir -p packaging/modal/bin
          cp target/release/lumen-server target/release/lumen packaging/modal/bin/

      # Arch selection. The dispatch input is read from env and allow-listed — it is
      # NEVER interpolated into a shell body (that would be a command-injection sink
      # on the runner that holds the Modal token).
      - name: choose arches
        id: arches
        env:
          ARCHES_IN: ${{ github.event.inputs.arches }}
        run: |
          set -euo pipefail
          known="T4 A10G L4 A100 H100"
          if [ -n "${ARCHES_IN:-}" ]; then
            for a in ${ARCHES_IN//,/ }; do
              case " $known " in *" $a "*) ;; *) echo "::error::unknown arch '$a' (allowed: $known)"; exit 1 ;; esac
            done
            printf 'list=%s\n' "$ARCHES_IN" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "list=T4,A10G,L4,A100,H100" >> "$GITHUB_OUTPUT"
          else
            echo "list=A100" >> "$GITHUB_OUTPUT"
          fi

      - name: run modal cross-arch validation
        env:
          ARCHES: ${{ steps.arches.outputs.list }}
        run: |
          set -o pipefail
          modal run packaging/modal/validate_arches.py --arches "$ARCHES" | tee modal-validation.log

      # Cost guard: a cancelled GitHub job SIGTERMs `modal run` but NOT the detached
      # `.spawn()` GPU containers — they would bill to their function timeout. Stop
      # the app on exit/cancel. (timeout in validate_arches.py is also tightened.)
      - name: stop lingering modal containers
        if: always()
        run: modal app stop lumen-phase1-arch-validation 2>/dev/null || true

      - name: per-arch verdict -> job summary
        if: always()
        run: |
          {
            echo '## CUDA cross-arch validation'
            echo '```'
            sed -n '/PER-ARCH VERDICT/,/VALIDATION /p' modal-validation.log 2>/dev/null || echo '(no verdict — see artifact log)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The modal step is authoritative (validate_arches.py exits non-zero on any
      # hard failure and set -o pipefail propagates it). Belt-and-suspenders.
      - name: gate on validation matrix
        run: |
          if ! grep -q "VALIDATION PASSED" modal-validation.log; then
            echo "::error::CUDA cross-arch validation failed — see the PER-ARCH VERDICT in the job summary / log"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cuda-arch-validation-${{ github.run_id }}
          path: |
            modal-validation.log
            /tmp/modal-val/
          if-no-files-found: error
          retention-days: 14

  # Always-runs required-check gate. Mark THIS as the required status check (not
  # modal-validate): it passes when validation succeeded OR was legitimately skipped
  # (docs-only PR / fork PR), and fails only on a real validation failure — so a
  # docs-only PR never deadlocks on a check that never ran.
  cuda-gate:
    needs: [changes, modal-validate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: evaluate
        run: |
          r='${{ needs.modal-validate.result }}'
          echo "modal-validate=$r  relevant=${{ needs.changes.outputs.relevant }}  event=${{ github.event_name }}"
          case "$r" in
            success) echo "gate PASS (validated)"; exit 0 ;;
            skipped) echo "gate PASS (validation not required for this change)"; exit 0 ;;
            *) echo "::error::CUDA validation gate: modal-validate=$r"; exit 1 ;;
          esac
